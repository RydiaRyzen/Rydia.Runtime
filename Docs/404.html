<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページが見つかりません — Rydia Engine</title>
    <link rel="stylesheet" href="/RydiaEngine.Docs/css/style.css">
    <style>
        /* 404ページ専用 */
        main.error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 80px 24px 40px;
            text-align: center;
        }

            main.error-page > .container {
                width: 100%;
                max-width: 960px;
                margin: 0 auto;
                padding: 0;
            }

            main.error-page .eyebrow {
                display: block;
                text-align: center;
            }

            main.error-page .hero-lead {
                max-width: 540px;
                margin: 0 auto 29px;
            }
    </style>
</head>
<body>
  <main class="hero error-page" style="min-height:100vh">
    <div class="container">
      <p class="eyebrow">ERROR / 404</p>
      <h1>Page not found<span>.</span></h1>
      <p class="hero-lead">指定されたページは見つかりませんでした。URLをご確認ください。</p>
      <a class="button button-primary" href="index.html">トップページへ戻る <span>→</span></a>
    </div>
  </main>
</body>
</html>
